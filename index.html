<form
  action="https://formspree.io/f/xrpeqrkn"
  method="POST"
  id="contact-form"
  accept-charset="UTF-8"
>

  <!-- Formspree settings -->
  <input type="hidden" name="_subject" value="New AJ Virtual Project Enquiry">

  <!-- Anti-spam honeypot -->
  <input
    type="text"
    name="_gotcha"
    tabindex="-1"
    autocomplete="off"
    style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;"
  >

  <!-- NAME + COMPANY -->
  <div class="form-grid">

    <div class="form-group">
      <label for="full-name">
        Full Name <span>*</span>
      </label>

      <input
        type="text"
        id="full-name"
        name="name"
        placeholder="Your full name"
        autocomplete="name"
        required
      >
    </div>

    <div class="form-group">
      <label for="company">
        Company
      </label>

      <input
        type="text"
        id="company"
        name="company"
        placeholder="Company name"
        autocomplete="organization"
      >
    </div>

  </div>


  <!-- EMAIL + PHONE -->
  <div class="form-grid">

    <div class="form-group">
      <label for="email">
        Email <span>*</span>
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@company.com"
        autocomplete="email"
        required
      >
    </div>

    <div class="form-group">
      <label for="phone">
        Phone
      </label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+61 ..."
        autocomplete="tel"
      >
    </div>

  </div>


  <!-- PROJECT TYPE + SIZE -->
  <div class="form-grid">

    <div class="form-group">
      <label for="project-type">
        Project Type
      </label>

      <select
        id="project-type"
        name="project_type"
      >
        <option value="Residential Fit-Out">
          Residential Fit-Out
        </option>

        <option value="Commercial Fit-Out">
          Commercial Fit-Out
        </option>

        <option value="Renovation / Refurbishment">
          Renovation / Refurbishment
        </option>

        <option value="Retail">
          Retail
        </option>

        <option value="Office">
          Office
        </option>

        <option value="Hospitality">
          Hospitality
        </option>

        <option value="Other">
          Other
        </option>
      </select>
    </div>


    <div class="form-group">
      <label for="project-size">
        Approx. Project Size
      </label>

      <input
        type="text"
        id="project-size"
        name="project_size"
        placeholder="e.g. 15,000 sq ft"
      >
    </div>

  </div>


  <!-- LOCATION + STAGE -->
  <div class="form-grid">

    <div class="form-group">
      <label for="project-location">
        Project Location
      </label>

      <input
        type="text"
        id="project-location"
        name="project_location"
        placeholder="Melbourne, VIC"
      >
    </div>


    <div class="form-group">
      <label for="construction-stage">
        Construction Stage
      </label>

      <select
        id="construction-stage"
        name="construction_stage"
      >
        <option value="Pre-construction">
          Pre-construction
        </option>

        <option value="Early construction">
          Early construction
        </option>

        <option value="Interior fit-out">
          Interior fit-out
        </option>

        <option value="Finishing stage">
          Finishing stage
        </option>

        <option value="Near completion">
          Near completion
        </option>

        <option value="Completed">
          Completed
        </option>

        <option value="Other">
          Other
        </option>
      </select>
    </div>

  </div>


  <!-- FREQUENCY -->
  <div class="form-group full-width">

    <label for="monitoring-frequency">
      Preferred Monitoring Frequency
    </label>

    <select
      id="monitoring-frequency"
      name="monitoring_frequency"
    >
      <option value="Weekly">
        Weekly
      </option>

      <option value="Fortnightly">
        Fortnightly
      </option>

      <option value="One-off">
        One-off
      </option>

      <option value="Not sure">
        Not sure
      </option>
    </select>

  </div>


  <!-- SERVICES -->
  <div class="form-group full-width">

    <label>
      Services you're interested in
    </label>

    <div class="checkbox-grid">

      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="360 Virtual Tour"
        >
        <span>360° Virtual Tour</span>
      </label>


      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="3D Point Cloud"
        >
        <span>3D Point Cloud</span>
      </label>


      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="Progress Monitoring"
        >
        <span>Progress Monitoring</span>
      </label>


      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="BIM Comparison"
        >
        <span>BIM Comparison</span>
      </label>


      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="Progress Reporting"
        >
        <span>Progress Reporting</span>
      </label>


      <label class="checkbox-item">
        <input
          type="checkbox"
          name="services[]"
          value="As-Built Documentation"
        >
        <span>As-Built Documentation</span>
      </label>

    </div>

  </div>


  <!-- BIM INFORMATION -->
  <div class="form-group full-width">

    <label for="bim-information">
      Do you have drawings / BIM / 3D model information?
    </label>

    <select
      id="bim-information"
      name="bim_information"
    >
      <option value="Yes">
        Yes
      </option>

      <option value="No">
        No
      </option>

      <option value="Not sure">
        Not sure
      </option>
    </select>

  </div>


  <!-- PROJECT DETAILS -->
  <div class="form-group full-width">

    <label for="project-details">
      Project Details
    </label>

    <textarea
      id="project-details"
      name="message"
      rows="7"
      placeholder="Tell us about your project, what you need captured, your current stage, and what you would like to compare or monitor."
    ></textarea>

  </div>


  <!-- SUBMIT -->
  <button
    type="submit"
    class="form-submit"
    id="submit-button"
  >
    Request My Project Assessment
  </button>


  <p class="form-note">
    Your enquiry will be securely submitted through our online enquiry form.
  </p>

</form>

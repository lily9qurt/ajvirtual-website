<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="3D building model as planned beside the point-cloud capture of the site as executed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10211d"/>
      <stop offset="1" stop-color="#23483f"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ead08a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ead08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a441" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="560"/><line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/><line x1="500" y1="0" x2="500" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/><line x1="700" y1="0" x2="700" y2="560"/>
  </g>

  <!-- LEFT: As planned (wireframe model) -->
  <ellipse cx="230" cy="330" rx="210" ry="70" fill="url(#glowL)"/>
  <g fill="none" stroke="#d9a441" stroke-width="2" stroke-linejoin="round">
    <polygon points="110,210 230,145 350,210 230,275"/>
    <polygon points="110,210 230,275 230,365 110,300"/>
    <polygon points="230,275 350,210 350,300 230,365"/>
  </g>
  <g fill="none" stroke="#ead08a" stroke-width="1.2" stroke-opacity="0.55">
    <line x1="230" y1="297.5" x2="350" y2="232.5"/>
    <line x1="230" y1="320" x2="350" y2="255"/>
    <line x1="150" y1="230" x2="150" y2="275"/>
    <line x1="190" y1="252" x2="190" y2="297"/>
    <line x1="170" y1="178" x2="290" y2="242" stroke-dasharray="5 5"/>
    <line x1="290" y1="178" x2="170" y2="242" stroke-dasharray="5 5" stroke-opacity="0.35"/>
  </g>
  <circle cx="230" cy="145" r="3" fill="#ead08a"/>
  <circle cx="110" cy="300" r="3" fill="#ead08a"/>
  <circle cx="350" cy="300" r="3" fill="#ead08a"/>

  <!-- RIGHT: As executed (captured point cloud) -->
  <g transform="translate(400 0)">
    <ellipse cx="230" cy="330" rx="210" ry="70" fill="url(#glowR)"/>
    <g fill="#ead08a" fill-opacity="0.16" stroke="#ead08a" stroke-opacity="0.5" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="110,210 230,145 350,210 230,275"/>
      <polygon points="110,210 230,275 230,365 110,300"/>
      <polygon points="230,275 350,210 350,300 230,365"/>
    </g>
    <!-- Point cloud -->
    <g fill="#ead08a">
      <circle cx="130" cy="252" r="2.4"/><circle cx="148" cy="268" r="2"/><circle cx="168" cy="236" r="2.6"/>
      <circle cx="158" cy="290" r="2"/><circle cx="182" cy="320" r="2.4"/><circle cx="196" cy="300" r="2"/>
      <circle cx="140" cy="312" r="2.2"/><circle cx="250" cy="300" r="2.4"/><circle cx="270" cy="322" r="2"/>
      <circle cx="292" cy="296" r="2.6"/><circle cx="310" cy="262" r="2"/><circle cx="326" cy="240" r="2.4"/>
      <circle cx="340" cy="278" r="2"/><circle cx="214" cy="248" r="2.2"/><circle cx="262" cy="266" r="2"/>
      <circle cx="230" cy="112" r="0"/>
      <circle cx="200" cy="168" r="2"/><circle cx="252" cy="178" r="2.4"/><circle cx="290" cy="194" r="2"/>
      <circle cx="176" cy="196" r="2.2"/><circle cx="226" cy="204" r="2"/><circle cx="318" cy="222" r="2.4"/>
    </g>
    <!-- Deviation marker: planned vs executed difference -->
    <polygon points="282,236 318,216 330,236 294,256" fill="none" stroke="#d9a441" stroke-width="1.8" stroke-dasharray="5 4"/>
    <circle cx="306" cy="236" r="4" fill="#d9a441"/>
  </g>

  <!-- Divider with glow -->
  <rect x="396" y="60" width="2" height="420" fill="url(#divider)"/>

  <!-- Labels -->
  <rect x="60" y="458" width="150" height="32" rx="8" fill="#10211d" fill-opacity="0.85"/>
  <text x="135" y="479" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.6">AS PLANNED</text>
  <rect x="460" y="458" width="165" height="32" rx="8" fill="#10211d" fill-opacity="0.85"/>
  <text x="542" y="479" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.6">AS EXECUTED</text>

  <text x="60" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9a441" letter-spacing="1.5">MODEL</text>
  <text x="460" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ead08a" letter-spacing="1.5">SITE CAPTURE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-label="360 degree camera capturing an interior fit-out" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10211d"/>
      <stop offset="1" stop-color="#315e52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="700" fill="url(#bg)"/>
  <ellipse cx="400" cy="520" rx="320" ry="90" fill="url(#glow)"/>
  <!-- Room outline -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M120 520 L260 380 L540 380 L680 520 Z"/>
    <path d="M120 520 L120 220 L260 160 L260 380"/>
    <path d="M680 520 L680 220 L540 160 L540 380"/>
    <rect x="260" y="160" width="280" height="220"/>
    <rect x="330" y="200" width="140" height="100" stroke="#d9a441" stroke-opacity="0.7"/>
  </g>
  <!-- Fit-out elements -->
  <rect x="150" y="430" width="90" height="45" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="560" y="420" width="100" height="55" fill="#ffffff" fill-opacity="0.12"/>
  <!-- Scan rings -->
  <g fill="none" stroke="#d9a441" stroke-width="1.5">
    <circle cx="400" cy="400" r="90" stroke-opacity="0.6"/>
    <circle cx="400" cy="400" r="150" stroke-opacity="0.4" stroke-dasharray="6 8"/>
    <circle cx="400" cy="400" r="215" stroke-opacity="0.25"/>
  </g>
  <!-- Tripod -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="430" x2="330" y2="560"/>
    <line x1="400" y1="430" x2="470" y2="560"/>
    <line x1="400" y1="430" x2="400" y2="575"/>
  </g>
  <!-- 360 camera -->
  <rect x="368" y="382" width="64" height="44" rx="10" fill="#d9a441"/>
  <circle cx="400" cy="404" r="9" fill="#10211d"/>
  <circle cx="400" cy="404" r="3" fill="#ead08a"/>
  <!-- Labels -->
  <text x="400" y="640" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">One Capture.</text>
  <text x="400" y="672" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.7">Multiple project outputs.</text>
</svg>
